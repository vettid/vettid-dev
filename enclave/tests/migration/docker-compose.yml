# Tier-2 migration test harness compose stack.
#
# Stands up LocalStack (S3 + KMS + SSM) + NATS JetStream + two
# vettid-parent containers attesting to different fake PCR0s. The
# init container writes the resource ARNs to a shared volume so the
# parents can pick them up without needing aws-cli baked in.
#
# Bring-up: ./run.sh (or `docker compose up --build`).
# Validation: `docker compose config` parses without running anything.

services:
  localstack:
    # Fully qualified registry path — podman in non-interactive mode
    # refuses to resolve short names ("localstack/localstack:3.7"
    # alone) and the compose-up hangs waiting for a TTY prompt.
    image: docker.io/localstack/localstack:3.7
    container_name: vettid-migration-localstack
    environment:
      - SERVICES=s3,kms,ssm
      - DEBUG=0
      - PERSISTENCE=0
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: docker.io/library/nats:2.10-alpine
    container_name: vettid-migration-nats
    # `-m 8222` enables the HTTP monitoring endpoint the healthcheck
    # probes. Without it the healthcheck `wget …/healthz` gets
    # connection-refused on :8222 forever, NATS stays in "starting",
    # and parent-old/parent-new never start (depends_on: nats: service_healthy).
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  init:
    image: docker.io/amazon/aws-cli:2.15.0
    container_name: vettid-migration-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      # `:Z` relabels the bind mount for SELinux so podman on Fedora
      # can read+exec it inside the container. Without it the script
      # bind-mount fails with "Permission denied" even though host
      # perms are 0755 — SELinux denies access from the container's
      # MCS label. Harmless on Docker (which ignores the suffix).
      - ./fixtures/localstack-init.sh:/init.sh:ro,Z
      - shared-arns:/shared
    entrypoint: ["/bin/bash", "/init.sh"]

  # OLD enclave — first FAKE_PCR0_HEX. The harness drives a user
  # enrollment against OLD, then publishes a migration config pointing
  # at NEW's PCR0 and asserts the handoff lands cleanly.
  parent-old:
    build:
      context: ../..
      dockerfile: tests/migration/Dockerfile.parent-dev
    container_name: vettid-migration-parent-old
    environment:
      # 48 raw bytes = SHA-384 width = 96 hex chars.
      - FAKE_PCR0_HEX=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - NATS_URL=nats://nats:4222
      - SHARED_ARNS=/shared/arns.env
    depends_on:
      init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    volumes:
      - shared-arns:/shared:ro
    ports:
      - "8081:8080"

  # NEW enclave — second FAKE_PCR0_HEX, different from OLD's. Gated
  # behind the `migration` profile so basic enrollment scenarios run
  # against a single parent, which removes a non-deterministic routing
  # race: attestation is stateless (both parents reply, driver picks
  # the first response), but pin.setup/credential.create are
  # enrollment-entry subjects subject to ClaimForEnrollment — if the
  # claim winner is the *other* parent than the one whose attestation
  # pubkey the driver got, ECIES decryption MAC-fails. Migration
  # scenarios explicitly opt in to two parents (`run.sh --with-new`).
  parent-new:
    profiles: ["migration"]
    build:
      context: ../..
      dockerfile: tests/migration/Dockerfile.parent-dev
    container_name: vettid-migration-parent-new
    environment:
      - FAKE_PCR0_HEX=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - NATS_URL=nats://nats:4222
      - SHARED_ARNS=/shared/arns.env
    depends_on:
      init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    volumes:
      - shared-arns:/shared:ro
    ports:
      - "8082:8080"

volumes:
  shared-arns:
